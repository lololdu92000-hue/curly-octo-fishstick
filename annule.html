<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paiement annulé — Maison Aurévia</title>
  <meta name="description" content="Paiement annulé.">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/pages.js" defer></script>
</head>
<body data-page="annule">
  <div id="header"></div>

  <main id="contenu">
    <section class="entete-page">
      <div class="hero__fond" aria-hidden="true"></div>
      <div class="conteneur">
        <span class="surtitre reveal">Paiement annulé</span>
        <h1 class="reveal" style="--delai:100ms">Votre commande n’a pas été finalisée</h1>
        <p class="reveal" style="--delai:200ms">Aucun montant n’a été débité. Votre panier vous attend.</p>
      </div>
    </section>

    <section class="section" style="padding-top:60px">
      <div class="conteneur">
        <div class="vide reveal" style="max-width:640px;margin:0 auto">
          <h2>Besoin d’aide ?</h2>
          <p>Si vous avez rencontré un problème lors du paiement, écrivez-nous : nous trouverons une solution ensemble.</p>
          <div class="hero__actions">
            <a class="btn btn--plein magnetique" href="/panier.html"><span class="btn__texte">Retour au panier</span></a>
            <a class="btn magnetique" href="/#contact"><span class="btn__texte">Nous contacter</span></a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="pied"></div>
</body>
</html>
