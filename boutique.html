<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique — Maison Aurévia</title>
  <meta name="description" content="Casquettes, bobs et sneakers Dior B22 / B30 d’occasion authentifiés : Fendi, Louis Vuitton, Gucci, Dior.">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/pages.js" defer></script>
</head>
<body data-page="boutique">
  <div id="header"></div>

  <main id="contenu">
    <section class="entete-page">
      <div class="hero__fond" aria-hidden="true"></div>
      <div class="conteneur">
        <span class="surtitre reveal">La boutique</span>
        <h1 class="reveal" style="--delai:100ms">Nos pièces <span class="italique or">authentifiées</span></h1>
        <p class="reveal" style="--delai:200ms">Choisissez la maison, le produit, puis l’ordre d’affichage.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="conteneur">
        <form class="filtres" role="search" aria-label="Filtrer les pièces" onsubmit="return false">
          <div class="filtre">
            <label for="filtre-marque">Maison</label>
            <div class="selecteur"><select id="filtre-marque"><option value="">Toutes les maisons</option></select></div>
          </div>
          <div class="filtre">
            <label for="filtre-type">Produit</label>
            <div class="selecteur"><select id="filtre-type"><option value="">Tous les produits</option></select></div>
          </div>
          <div class="filtre">
            <label for="filtre-tri">Trier par</label>
            <div class="selecteur">
              <select id="filtre-tri">
                <option value="nouveautes">Nouveautés</option>
                <option value="prix-asc">Prix croissant</option>
                <option value="prix-desc">Prix décroissant</option>
              </select>
            </div>
          </div>
          <div class="filtres__compte">
            <span id="compte-resultats" aria-live="polite">…</span>
            <button class="filtres__reset" id="filtres-reset" type="button" hidden>Effacer</button>
          </div>
        </form>

        <div class="grille-produits" id="catalogue" data-stagger="80"></div>

      </div>
    </section>
  </main>

  <div id="pied"></div>
</body>
</html>
