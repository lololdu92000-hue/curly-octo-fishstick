<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:InterX;src:url(fonts/inter-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:InterX;src:url(fonts/inter-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:#111}
canvas{display:block;width:540px;height:960px}
</style></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const OUT=document.getElementById('out').getContext('2d');
const FR=document.createElement('canvas');FR.width=W;FR.height=H;
let ctx=FR.getContext('2d');
const RED='#ff3b30',INK='#141414';
const SERIF=s=>`italic 700 ${s}px "Liberation Serif","DejaVu Serif",serif`;
// ================= utils
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x;
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y,s=0){let h=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return h-Math.floor(h)}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 return lerp(lerp(hash(xi,yi,s),hash(xi+1,yi,s),u),lerp(hash(xi,yi+1,s),hash(xi+1,yi+1,s),u),v)}
function fbm(x,y,s){return vnoise(x,y,s)*.5+vnoise(x*2.03,y*2.03,s+3)*.3+vnoise(x*4.1,y*4.1,s+7)*.2}
const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function shadowOn(b=40,oy=14,a=.25){ctx.shadowColor=`rgba(0,0,0,${a})`;ctx.shadowBlur=b;ctx.shadowOffsetY=oy}
function shadowOff(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);return c}

// ================= TOWER RENDERER (cylindre 3D, mosaïque, lumière)
const PALM=[[248,251,255],[226,238,250],[196,222,244],[160,200,236],[118,170,222],[80,136,198],[52,100,168],[38,74,130]];
const MODES={
 day:{L:[-.55,.83],amb:.62,kd:.5,tint:[1,1,1],spec:.55,specC:[255,255,255],fog:[205,225,245]},
 sunset:{L:[-.93,.36],amb:.40,kd:.78,tint:[1.16,.86,.70],spec:.9,specC:[255,214,160],fog:[250,190,150]},
 night:{L:[.15,.98],amb:.26,kd:.10,tint:[.42,.52,.82],spec:.15,specC:[150,170,255],fog:[25,35,70]},
 concrete:{L:[-.55,.83],amb:.62,kd:.5,tint:[1,1,1],spec:.05,specC:[255,255,255],fog:[205,225,245],concrete:true},
};
const K=0.13; // ellipse ratio (vue légèrement plongeante)
function makeTower(R,h,seed,mode,fog=0){
 const M=MODES[mode];const pad=6;const w=2*R+pad*2,Ht=h+2*K*R+pad*2;
 const c=mk(w,Ht),g=c.getContext('2d');const cx=w/2,y0=Ht-pad-K*R;
 const N=Math.max(26,Math.round(R*.5)),ts=Math.PI*R/N,rows=Math.ceil(h/ts);
 const P=(th,yy)=>[cx+R*Math.sin(th),y0-yy+K*R*Math.cos(th)];
 // body (joints)
 g.fillStyle=M.concrete?'#b9b2a8':rgb(mixc([215,220,226],[0,0,0],0).map((v,i)=>v*M.tint[i]*(M.amb+.15)));
 g.beginPath();g.moveTo(cx-R,y0-h);g.lineTo(cx-R,y0);g.ellipse(cx,y0,R,K*R,0,Math.PI,0,true);g.lineTo(cx+R,y0-h);g.ellipse(cx,y0-h,R,K*R,0,0,Math.PI,true);g.fill();
 const [lx,lz]=M.L;const hx=lx,hz=lz+1,hn=Math.hypot(hx,hz);
 for(let i=0;i<N;i++){const t1=-Math.PI/2+i*Math.PI/N,t2=t1+Math.PI/N,tm=(t1+t2)/2;
  const nx=Math.sin(tm),nz=Math.cos(tm);const diff=Math.max(0,nx*lx+nz*lz);const sp=Math.pow(Math.max(0,(nx*hx+nz*hz)/hn),38);
  const ia=t1+(t2-t1)*.09,ib=t2-(t2-t1)*.09;
  for(let j=0;j<rows;j++){const ya=j*ts+ts*.09,yb=Math.min(h,(j+1)*ts)-ts*.09;if(yb<=ya)continue;
   let base;
   if(M.concrete){const n=hash(i,j,seed);base=[200+n*14,194+n*12,184+n*10]}
   else{let n=fbm(tm*R/(R*1.15)+seed*3.1,j*ts/(R*1.15)+seed*7.3,seed);n=clamp((n-.22)/.6);n=clamp(n*.8+(j/rows)*.32-.06);
    base=PALM[Math.min(7,Math.floor(n*8))];const jit=(hash(i,j,seed+2)-.5)*14;base=base.map(v=>v+jit)}
   const gl=.35+.65*hash(i,j,seed+4);
   let col=base.map((v,k)=>v*M.tint[k]*(M.amb+M.kd*diff)+M.specC[k]*sp*M.spec*gl);
   col=mixc(col,M.fog,fog);
   const a=P(ia,ya),b=P(ib,ya),cc=P(ib,yb),d=P(ia,yb);
   g.fillStyle=rgb(col);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(cc[0],cc[1]);g.lineTo(d[0],d[1]);g.fill();
  }}
 // fenêtres
 const wins=[];const wr=Math.max(4,Math.round(5.2*(R/90))),wc=Math.max(3,Math.round(N/7));
 for(let r=2,ri=0;r*ts<h-ts*3;r+=wr,ri++)for(let ci=0;ci<N;ci+=wc){
  const col=ci+(ri%2?wc/2:0)+ (hash(ci,ri,seed)-.5)*1.2;const th=-Math.PI/2+(col+.5)*Math.PI/N;const ct=Math.cos(th);if(ct<.18)continue;
  if(hash(ci,ri,seed+11)<.12)continue;
  const yy=r*ts+ts*1.5+(hash(ci,ri,seed+3)-.5)*ts*1.5;const [x,y]=P(th,yy);
  const type=Math.floor(hash(ci,ri,seed+9)*3);const sw=ts*2.3*ct,sh=ts*2.7;
  wins.push({x,y,type,sw,sh});
  let fill;if(mode==='night'){const lit=hash(ci,ri,seed+21)<.58;
   if(lit){const gr=g.createLinearGradient(0,y-sh/2,0,y+sh/2);gr.addColorStop(0,'#ffe2a8');gr.addColorStop(1,'#f0a24a');fill=gr}else fill='#0d1426'}
  else{const gr=g.createLinearGradient(x-sw/2,y-sh/2,x+sw/2,y+sh/2);const sun=mode==='sunset';
   gr.addColorStop(0,sun?'#ffd2a0':'#cfe6fb');gr.addColorStop(.35,sun?'#6b4a5a':'#33506f');gr.addColorStop(1,'#121c2c');fill=gr}
  g.fillStyle=mode==='concrete'?'#3c3a38':fill;windowPath(g,x,y,sw,sh,type);g.fill();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=Math.max(.6,ts*.18);g.stroke();
  if(fog>0){g.fillStyle=rgb(M.fog,fog*.8);windowPath(g,x,y,sw,sh,type);g.fill()}
 }
 // toit
 g.fillStyle=rgb(mixc([170,164,156].map((v,k)=>v*M.tint[k]*(M.amb+.3)),M.fog,fog));g.beginPath();g.ellipse(cx,y0-h,R,K*R,0,0,7);g.fill();
 g.fillStyle=rgb(mixc([120,116,110].map((v,k)=>v*M.tint[k]*(M.amb+.3)),M.fog,fog));g.beginPath();g.ellipse(cx,y0-h+K*R*.15,R*.86,K*R*.8,0,0,7);g.fill();
 // AO pied + lumière du ciel en haut
 g.globalCompositeOperation='source-atop';
 const ao=g.createLinearGradient(0,y0-Math.min(h,R*2.2),0,y0+K*R);ao.addColorStop(0,'rgba(0,0,0,0)');ao.addColorStop(1,'rgba(10,15,30,.45)');g.fillStyle=ao;g.fillRect(0,0,w,Ht);
 const tl=g.createLinearGradient(0,y0-h,0,y0-h+R*3);tl.addColorStop(0,'rgba(255,255,255,.12)');tl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=tl;g.fillRect(0,0,w,Ht);
 g.globalCompositeOperation='source-over';
 return {c,y0,cx,R,h,wins,pad};
}
function windowPath(g,x,y,sw,sh,type){g.beginPath();
 if(type===0)g.ellipse(x,y,sw*.5,sh*.42,0,0,7);
 else if(type===1)g.roundRect(x-sw*.45,y-sh*.42,sw*.9,sh*.84,Math.min(sw,sh)*.12);
 else{const s=sh*.5;g.moveTo(x,y-s);g.bezierCurveTo(x+sw*.62,y-s*.05,x+sw*.55,y+s*.85,x,y+s*.85);g.bezierCurveTo(x-sw*.55,y+s*.85,x-sw*.62,y-s*.05,x,y-s)}}

// ================= world: 18 tours + arbres
const TW=[];{const pos=[[-620,1700],[-300,1550],[40,1650],[380,1580],[700,1720],[-820,2150],[-470,2050],[-150,2250],[200,2100],[520,2200],[860,2300],[-700,2700],[-350,2850],[0,2650],[330,2900],[640,2750],[-1000,3200],[950,3150]];
 pos.forEach(([x,z],i)=>TW.push({x,z,R:72+hash(i,1)*40,h:[380,560,720,900,1050][Math.floor(hash(i,2)*5)]*(z>2600?1.12:1),seed:i+1,i}))}
const TREES=[];for(let i=0;i<46;i++){TREES.push({x:(hash(i,7)-.5)*2600,z:1250+hash(i,8)*2200,s:.8+hash(i,9)*.6,v:i%4})}
const BM={};function tower(tw,mode){const fog=clamp((tw.z-1500)/2600)*.45;const k=tw.seed+mode;if(!BM[k])BM[k]=makeTower(Math.round(tw.R),Math.round(tw.h),tw.seed,mode,fog);return BM[k]}
// sprites
const TREE_SPR=[];function makeTrees(){for(let v=0;v<4;v++){const c=mk(220,260),g=c.getContext('2d');g.fillStyle='#4a3a2a';g.fillRect(104,170,12,80);
 for(let k=0;k<26;k++){const a=hash(k,v)*6.28,r=hash(k,v+1)*60,x=110+Math.cos(a)*r,y=120+Math.sin(a)*r*.8,s=26+hash(k,v+2)*22;
  const gr=g.createRadialGradient(x-s*.4,y-s*.4,2,x,y,s);const base=[[70,120,60],[60,110,70],[85,130,55],[55,100,60]][v];
  gr.addColorStop(0,rgb(base.map(c=>c+60)));gr.addColorStop(.7,rgb(base));gr.addColorStop(1,rgb(base.map(c=>c*.6)));g.fillStyle=gr;g.beginPath();g.arc(x,y,s,0,7);g.fill()}
 TREE_SPR.push(c)}}
const CLOUD=[];function makeClouds(){for(let v=0;v<5;v++){const c=mk(700,300),g=c.getContext('2d');g.filter='blur(6px)';
 for(let k=0;k<22;k++){const x=120+hash(k,v)*460,y=170-Math.sin((x-120)/460*Math.PI)*70+hash(k,v+3)*30,s=40+hash(k,v+1)*55;
  const gr=g.createRadialGradient(x,y-s*.3,2,x,y,s);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.75,'rgba(240,244,250,.85)');gr.addColorStop(1,'rgba(220,228,240,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,s,0,7);g.fill()}
 CLOUD.push(c)}}
const GRAIN=[];function makeGrain(){for(let v=0;v<4;v++){const c=mk(540,960),g=c.getContext('2d'),id=g.createImageData(540,960);for(let i=0;i<id.data.length;i+=4){const n=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=n;id.data[i+3]=255}g.putImageData(id,0,0);GRAIN.push(c)}}
let VIG;function makeVig(){VIG=mk(W,H);const g=VIG.getContext('2d');const gr=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=gr;g.fillRect(0,0,W,H)}

// ================= sky / ground
const SKY={day:[[58,120,200],[120,175,232],[214,233,248]],sunset:[[40,50,110],[200,110,120],[255,180,110]],night:[[6,10,28],[18,30,70],[45,60,110]]};
function skyCols(m){// m: 0 day ->1 sunset ->2 night
 const a=m<1?SKY.day:SKY.sunset,b=m<1?SKY.sunset:SKY.night,t=m<1?m:m-1;return a.map((c,i)=>mixc(c,b[i],t))}
function sky(t,m,hor,sunX=200,sunY=null){const cs=skyCols(m);const g=ctx.createLinearGradient(0,0,0,hor);g.addColorStop(0,rgb(cs[0]));g.addColorStop(.6,rgb(cs[1]));g.addColorStop(1,rgb(cs[2]));ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,hor+200);
 if(m>1.3){const a=clamp((m-1.3)/.7);for(let i=0;i<120;i++){ctx.fillStyle=`rgba(255,255,255,${a*(.3+.7*hash(i,4))*(.6+.4*Math.sin(t*3+i))})`;ctx.fillRect(hash(i,1)*W,hash(i,2)*hor*.8,2,2)}}
 const sy=sunY??lerp(260,hor-40,clamp(m))+(m>1?(m-1)*300:0);
 if(m<1.6){const sa=1-clamp((m-1)/.6);const sg=ctx.createRadialGradient(sunX,sy,0,sunX,sy,700);const sc=m<1?mixc([255,250,225],[255,170,90],m):[255,150,80];
  sg.addColorStop(0,rgb(sc,.95*sa));sg.addColorStop(.06,rgb(sc,.7*sa));sg.addColorStop(.25,rgb(sc,.22*sa));sg.addColorStop(1,rgb(sc,0));ctx.fillStyle=sg;ctx.fillRect(-200,-200,W+400,hor+200)}
 for(let i=0;i<5;i++){const x=((i*290+t*(14+i*4))%1600)-400,y=180+i*90;ctx.globalAlpha=(m<1?.9:m<2?.9-(m-1)*.6:.3)*(.6+.4*hash(i,3));ctx.drawImage(CLOUD[i],x,y,700*(.8+hash(i,5)*.5),300*(.8+hash(i,5)*.5))}ctx.globalAlpha=1;
 if(m>=.6&&m<1.6){ctx.fillStyle=`rgba(255,120,60,${.18*(1-Math.abs(m-1.05)/.5)})`;ctx.fillRect(-200,-200,W+400,hor+200)}
}
function skyline(hor,m){ // silhouette lointaine
 const cs=skyCols(m);const c=mixc(cs[2],[90,100,120],.35);ctx.fillStyle=rgb(c,.9);
 for(let i=0;i<34;i++){const x=-100+i*40+hash(i,1)*20,w=26+hash(i,2)*40,h=20+hash(i,3)*(i>12&&i<22?150:60);ctx.fillRect(x,hor-h,w,h+2)}
}
function ground(hor,m){const g=ctx.createLinearGradient(0,hor,0,H+200);const d=m<1?mixc([128,160,96],[150,120,80],m):mixc([150,120,80],[24,34,40],m-1);
 g.addColorStop(0,rgb(mixc(d,skyCols(m)[2],.5)));g.addColorStop(.15,rgb(d));g.addColorStop(1,rgb(d.map(v=>v*.55)));ctx.fillStyle=g;ctx.fillRect(-200,hor,W+400,H-hor+400);
 // allées
 ctx.strokeStyle=rgb(mixc([215,205,185],d,.3),.55);ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(W*.55,hor);ctx.quadraticCurveTo(W*.3,hor+400,-100,H+100);ctx.stroke();
}
// ================= cluster scene
function cluster(t,o){
 const {m=0,camX=0,camY=420,f=1500,hor=980,grow=null,highlight=-1,mix=null}=o;
 const proj=(x,z)=>({sx:W/2+(x-camX)*f/z,by:hor+camY*f/z,s:f/z});
 const items=[...TW.map(tw=>({tw,z:tw.z})),...TREES.map(tr=>({tr,z:tr.z}))].sort((a,b)=>b.z-a.z);
 // ombres
 const sh=m<1?lerp(.55,1.6,m):1.6;const sa=m<1.4?.28:.28*(1-clamp((m-1.4)/.4));
 for(const tw of TW){const p=proj(tw.x,tw.z);const gp=grow?grow(tw.i):1;if(gp<=0)continue;const R=tw.R*p.s,len=tw.h*p.s*sh*gp*.55;
  ctx.fillStyle=`rgba(20,30,50,${sa})`;ctx.beginPath();ctx.ellipse(p.sx+len*.55,p.by+2,len*.6+R,R*.32,-.05,0,7);ctx.fill();
  ctx.fillStyle=`rgba(10,15,25,${sa*1.2})`;ctx.beginPath();ctx.ellipse(p.sx,p.by+2,R*1.1,R*K*1.5,0,0,7);ctx.fill()}
 for(const it of items){
  if(it.tr){const p=proj(it.tr.x,it.tr.z);const s=p.s*it.tr.s*1.1;ctx.globalAlpha=1;ctx.drawImage(TREE_SPR[it.tr.v],p.sx-110*s,p.by-250*s,220*s,260*s);
   if(m>0){ctx.fillStyle=`rgba(0,0,0,0)`}continue}
  const tw=it.tw,p=proj(tw.x,tw.z);const gp=grow?grow(tw.i):1;if(gp<=0)continue;
  const draw=(mode,alpha)=>{if(alpha<=0)return;const b=tower(tw,mode);const s=p.s;const dw=b.c.width*s,dh=b.c.height*s;
   ctx.save();ctx.globalAlpha=alpha;if(gp<1){const vis=b.h*gp*s;ctx.beginPath();ctx.rect(p.sx-dw,p.by-vis-20*s-K*b.R*s,dw*2,vis+K*b.R*s*3+20);ctx.clip();ctx.translate(0,(1-gp)*b.h*s)}
   ctx.drawImage(b.c,p.sx-b.cx*s,p.by-b.y0*s,dw,dh);ctx.restore()};
  if(mix){mix.forEach(([mode,a])=>draw(mode,a))}else draw(m<.5?'day':m<1.5?'sunset':'night',1);
  if(highlight>=0&&tw.order!==undefined&&tw.order<highlight){}
 }
 return proj;
}

// ================= captions
function caption(lt,text,opt={}){
 const size=opt.size||56,lh=size*1.3,x0=70,maxW=W-140,y=opt.y||250;
 const words=[];let acc=false;for(const raw of text.split(' ')){let w=raw;if(w.startsWith('*')){acc=true;w=w.slice(1)}let end=false;const mm=w.match(/\*([^\w\u00C0-\u017F]*)$/);if(mm){end=true;w=w.slice(0,mm.index)+mm[1]}words.push({w,acc});if(end)acc=false}
 // layout
 let x=x0,line=0;const lay=[];ctx.font=`800 ${size}px InterX`;const sp=ctx.measureText(' ').width;
 for(const o of words){ctx.font=o.acc?SERIF(size+8):`800 ${size}px InterX`;const ww=ctx.measureText(o.w).width;if(x+ww>x0+maxW&&x>x0){x=x0;line++}lay.push({...o,x,line,ww});x+=ww+sp}
 const lines=line+1;const boxH=lines*lh+46;
 const pIn=eOut(prog(lt,0,.3));
 ctx.save();ctx.globalAlpha=pIn;shadowOn(30,10,.18);ctx.fillStyle='rgba(255,255,255,.94)';rr(40,y-size-22-(1-pIn)*20,W-80,boxH,30);ctx.fill();shadowOff();ctx.restore();
 lay.forEach((o,i)=>{const p=eOut(prog(lt,.1+i*.075,.1+i*.075+.22));if(p<=0)return;ctx.globalAlpha=p;
  ctx.font=o.acc?SERIF(size+8):`800 ${size}px InterX`;const yy=y+o.line*lh+(1-p)*16;
  if(o.acc){ctx.fillStyle='rgba(255,59,48,.14)';ctx.fillRect(o.x-4,yy-size*.75,(o.ww+8)*eOut(prog(lt,.25+i*.075,.6+i*.075)),size*.95)}
  ctx.fillStyle=o.acc?RED:INK;ctx.fillText(o.w,o.x,yy);ctx.globalAlpha=1});
}
function tag(text){ctx.font='800 26px InterX';const w=ctx.measureText(text).width+40;ctx.fillStyle=RED;rr(60,120,w,46,23);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(text,80,152)}
function bigTitle(lt,parts,y,size,t0=.2,col=INK){const p=prog(lt,t0,t0+.35);if(p<=0)return;const s=p<1?lerp(2.2,1,eOut(p)):1;
 ctx.save();ctx.translate(W/2,y);ctx.scale(s,s);ctx.globalAlpha=clamp(p*3);ctx.font=`${size}px Anton`;const gap=size*.25;const ws=parts.map(([s])=>ctx.measureText(s).width);let x=-(ws.reduce((a,b)=>a+b,0)+gap*(parts.length-1))/2;
 shadowOn(30,8,.35);parts.forEach(([s,red],i)=>{ctx.fillStyle=red?RED:col;ctx.fillText(s,x,0);x+=ws[i]+gap});shadowOff();ctx.restore()}
function card(x,y,w,h,p,draw,dark=false){if(p<=0)return;const s=eBack(p);ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(s,s);ctx.globalAlpha=clamp(p*2);ctx.translate(-w/2,-h/2);
 shadowOn(50,20,.3);ctx.fillStyle=dark?'rgba(20,20,24,.92)':'#fff';rr(0,0,w,h,34);ctx.fill();shadowOff();draw(w,h);ctx.restore()}
function pill(x,y,text,bg,fg,size,p=1){if(p<=0)return;ctx.save();ctx.font=`800 ${size}px InterX`;const w=ctx.measureText(text).width+size*1.3;ctx.translate(x+w/2,y);ctx.scale(eBack(p),eBack(p));
 shadowOn(24,8,.3);ctx.fillStyle=bg;rr(-w/2,-size*.9,w,size*1.8,size*.9);ctx.fill();shadowOff();ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText(text,0,size*.35);ctx.restore()}
