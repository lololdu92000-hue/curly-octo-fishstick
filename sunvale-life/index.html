// ---------- Texture helpers ----------
function canvasTex(w, h, draw, srgb = true) {

  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;

}
function noise(ctx, w, h, amt, alpha = 0.08) {

const facadeCache = {};

    g.fillStyle = base; g.fillRect(0, 0, S, S);

      g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(0, r * rh + rh - 6, S, 6);
      g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(0, r * rh + rh - 8, S, 2);
      for (let c = 0; c < cols; c++) {
        const x = c * cw, y = r * rh;
        let wx, wy, ww, wh;
        if (style === 0) { wx = x + 18; wy = y + 22; ww = cw - 36; wh = rh - 46; }
        else if (style === 1) { wx = x + 8; wy = y + 30; ww = cw - 16; wh = rh - 54; }
        else { wx = x + 26; wy = y + 16; ww = cw - 52; wh = rh - 36; }
        const on = rnd() < 0.13; lit.push([wx, wy, ww, wh, on]);
        const gr = g.createLinearGradient(wx, wy, wx + ww, wy + wh);
        gr.addColorStop(0, '#2b3a4c'); gr.addColorStop(0.5, '#56708a'); gr.addColorStop(1, '#1b2430');
        g.fillStyle = gr; g.fillRect(wx, wy, ww, wh);
        g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(wx, wy, ww * 0.35, wh);
        g.strokeStyle = 'rgba(240,240,235,0.85)'; g.lineWidth = 4; g.strokeRect(wx, wy, ww, wh);
        g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.stroke();
        if (style === 2) { g.fillStyle = 'rgba(30,20,20,0.5)'; g.fillRect(wx - 6, wy + wh, ww + 12, 7); } // balcony
      }
    }
  });
  const em = canvasTex(S, S, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    for (const [wx, wy, ww, wh, on] of lit) if (on) {
      const gr = g.createLinearGradient(wx, wy, wx, wy + wh);
      gr.addColorStop(0, '#ffcf87'); gr.addColorStop(1, '#ff9b4a');
      g.fillStyle = gr; g.fillRect(wx + 3, wy + 3, ww - 6, wh - 6);
    }
  });

    g.fillStyle = '#202020'; for (const [wx, wy, ww, wh] of lit) g.fillRect(wx, wy, ww, wh);
  }, false);
  return facadeCache[key] = { map, em, rough };
}

function glassTex() {
  const S = 512;

    g.fillStyle = '#5f7d97'; g.fillRect(0, 0, S, S);

const palette = ['#e8c9a0', '#f2a07b', '#e07a5f', '#81b29a', '#f4f1de', '#e9d8a6', '#94d2bd', '#ee9b00', '#bb3e03', '#d4a5a5', '#a8dadc', '#f6bd60', '#c97b63', '#efe6dd', '#b5838d', '#ffcdb2'];

const statics = [];
function building(x, z, w, d, h) {

    const fz = z + d / 2 + 1.5; awn.position.set(x, 5, fz); awn.rotation.x = 0.25; awn.castShadow = true; scene.add(awn);
    const shop = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.85, 3.8), new THREE.MeshStandardMaterial({ color: 0x222831, emissive: new THREE.Color(1.6, 1.0, 0.55), emissiveIntensity: 0.9, roughness: 0.2 }));
    shop.position.set(x, 2.2, z + d / 2 + 0.05); scene.add(shop);
  }
}

// ---------- Ground, roads ----------
const groundTex = canvasTex(512, 512, (g) => { g.fillStyle = '#7a8a55'; g.fillRect(0, 0, 512, 512); noise(g, 512, 512, 50); });
groundTex.repeat.set(80, 80);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, envMapIntensity: 0.4 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);

const asphalt = canvasTex(512, 512, (g) => { g.fillStyle = '#3a3b3e'; g.fillRect(0, 0, 512, 512); noise(g, 512, 512, 36); for (let i = 0; i < 40; i++) { g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1 + rnd() * 2; g.beginPath(); g.moveTo(rnd() * 512, rnd() * 512); g.lineTo(rnd() * 512, rnd() * 512); g.stroke(); } });
const sidewalkTex = canvasTex(256, 256, (g) => { g.fillStyle = '#b9b2a6'; g.fillRect(0, 0, 256, 256); g.strokeStyle = '#8f887e'; g.lineWidth = 2; for (let i = 0; i <= 256; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke(); } noise(g, 256, 256, 20); });

const BX = 64, BZ = 72, ROAD = 18, BLVD = 34;
const xs = [], zs = [];
for (let i = -6; i <= 6; i++) xs.push(i * (BX + ROAD));
for (let j = -9; j <= 2; j++) zs.push(j * (BZ + ROAD));

function roadStrip(x, z, w, l, rot) {

  m.rotation.x = -Math.PI / 2; m.rotation.z = rot; m.position.set(x, 0.02, z); m.receiveShadow = true; scene.add(m);
}
const swT2 = sidewalkTex; const swMat2 = new THREE.MeshStandardMaterial({ color: 0xf2e6d4, map: sidewalkTex, roughness: 0.95, envMapIntensity: 0.35 });
const lineMat = new THREE.MeshBasicMaterial({ color: 0xf2d16b });

}

for (let i = -6; i < 6; i++) nsRoads.push((i + 0.5) * (BX + ROAD));

  for (let z = zMin; z < zMax; z += 10) { const l = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 5), lineMat); l.rotation.x = -Math.PI / 2; l.position.set(rx, 0.05, z); scene.add(l); }
}
for (const rz of ewRoads) {

  for (let x = xMin; x < xMax; x += 10) { const l = new THREE.Mesh(new THREE.PlaneGeometry(5, 0.4), lineMat); l.rotation.x = -Math.PI / 2; l.position.set(x, 0.05, rz); scene.add(l); }
}
// Boulevard
roadStrip(blvdX, (zMin + zMax) / 2, BLVD + 20, zMax - zMin + 400, 0);
for (const s of [-1,1]) for (let j = -9; j <= 1; j++) { const sw = new THREE.Mesh(new THREE.BoxGeometry(32, 0.4, BZ), swMat2); sw.position.set(s*43, 0.2, j*(BZ+ROAD)); sw.receiveShadow = true; scene.add(sw); }
const median = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, zMax - zMin + 400), new THREE.MeshStandardMaterial({ color: 0x5e7a3a, roughness: 1 }));
median.position.set(0, 0.25, (zMin + zMax) / 2); median.receiveShadow = true; scene.add(median);
for (const s of [-1, 1]) for (const off of [8, 16]) for (let z = zMin - 200; z < zMax + 200; z += 9) {
  const l = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 4), whiteMat); l.rotation.x = -Math.PI / 2; l.position.set(s * off, 0.05, z); scene.add(l);
}
// sidewalks / block pads
const swMat = new THREE.MeshStandardMaterial({ map: sidewalkTex, color: 0xf2e6d4, roughness: 0.95, envMapIntensity: 0.35 });
sidewalkTex.repeat.set(10, 10);

// ---------- City blocks ----------
const downtown = new THREE.Vector2(40, -260);
for (let i = -6; i <= 6; i++) for (let j = -9; j <= 1; j++) {
  const cx = i * (BX + ROAD), cz = j * (BZ + ROAD) ;
  if (i === 0) continue; // boulevard corridor
  let bx = cx; if (i === -1) bx -= 0;
  const pad = new THREE.Mesh(new THREE.BoxGeometry(BX, 0.4, BZ), swMat); pad.position.set(bx, 0.2, cz); pad.receiveShadow = true; scene.add(pad);
  const dist = new THREE.Vector2(bx, cz).distanceTo(downtown);

  if ((i === 2 && j === -1) || (i === -3 && j === -5)) {
    const park = new THREE.Mesh(new THREE.BoxGeometry(BX - 4, 0.6, BZ - 4), new THREE.MeshStandardMaterial({ color: 0x5f8a3a, roughness: 1 }));
    park.position.set(bx, 0.3, cz); park.receiveShadow = true; scene.add(park);

// ---------- Trees & palms ----------
function tree(x, z) {

  t.position.set(x, 2, z); t.castShadow = true; scene.add(t);
  const c = new THREE.Mesh(new THREE.IcosahedronGeometry(rr(2.6, 3.8), 1), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(rr(0.22, 0.3), 0.45, rr(0.22, 0.32)), roughness: 0.9, flatShading: true }));
  c.position.set(x, rr(5.5, 6.5), z); c.castShadow = true; scene.add(c);
}
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 1 });
const frondMat = new THREE.MeshStandardMaterial({ color: 0x3f6b2a, roughness: 0.8, side: THREE.DoubleSide });

  const tr = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.38, 6), trunkMat); tr.position.set(x, 0, z); tr.castShadow = true; scene.add(tr);

  }

for (let z = zMin - 150; z < zMax + 150; z += 16) palm(0, z, rr(13, 19));

// ---------- Street lamps ----------
const poleMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.7, roughness: 0.4 });
const bulbMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(6, 4.2, 2.2) });
for (let z = zMin - 100; z < zMax + 100; z += 30) for (const s of [-1, 1]) {
  const x = s * 25;

function car(x, z, rotY) {

  const rf = new THREE.Mesh(new THREE.BoxGeometry(Wd * 0.88, 0.08, L * 0.48), paint); rf.position.set(0, (big ? 2.08 : 1.86), -0.15); g.add(rf);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) { const t = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.3, 14), tireMat); t.rotation.z = Math.PI / 2; t.position.set(sx * 0.95, 0.38, sz * L * 0.32); g.add(t); }
  for (const sx of [-0.7, 0.7]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.18, 0.05), headMat); h.position.set(sx, 0.85, -L / 2 - 0.01); g.add(h);

  }
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
}

}, false);

// ---------- Hills with SUNVALE sign ----------
function hills(cx, cz, w, d, hmax, color) {
  const g = new THREE.PlaneGeometry(w, d, 120, 60); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const n = Math.sin(x * 0.006 + 1.3) * 0.5 + Math.sin(x * 0.017 + z * 0.01) * 0.25 + Math.sin(x * 0.041) * 0.12 + 0.5;
    const edge = Math.max(0, 1 - Math.abs(z) / (d / 2)); p.setY(i, Math.max(0, n * hmax * Math.pow(edge, 0.8)));
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 1, flatShading: false }));
  m.position.set(cx, -2, cz); m.receiveShadow = true; m.castShadow = true; scene.add(m); return m;
}

// ---------- Post ----------
function render() {
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(PR); composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.6, 0.92));
  composer.addPass(new OutputPass());
  composer.render();
  window.__done = true;
}
